# Builds the static site and publishes it to GitHub Pages on every push to main.
# Content comes from the committed content/site.json and media/ folder
# (run `pnpm export-content` before pushing). No database is needed here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer push cancels a deploy still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build:static
        env:
          NEXT_PUBLIC_BUTTONDOWN_USER: ${{ secrets.NEXT_PUBLIC_BUTTONDOWN_USER }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
